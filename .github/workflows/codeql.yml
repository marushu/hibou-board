name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '21 3 * * 1'
permissions:
  contents: read
jobs:
  analyze:
    name: CodeQL JavaScript
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v4
